# OpenWA - Nginx Reverse Proxy Config
# Place at /etc/nginx/sites-available/openwa
# Then: ln -s /etc/nginx/sites-available/openwa /etc/nginx/sites-enabled/
# Then: certbot --nginx -d whatsapp.btbite.digital
# Then: systemctl reload nginx

server {
    listen 80;
    server_name whatsapp.btbite.digital;

    # Redirect HTTP -> HTTPS (after certbot runs, it adds the SSL block)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name whatsapp.btbite.digital;

    # SSL certificates - certbot will fill these in automatically
    # ssl_certificate     /etc/letsencrypt/live/whatsapp.btbite.digital/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/whatsapp.btbite.digital/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;

        # WebSocket support (for live session updates, QR codes, etc.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WhatsApp sessions take time to start (Chromium boot)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
